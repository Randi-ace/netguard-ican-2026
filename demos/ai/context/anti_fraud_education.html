      <h2>常见骗局特征</h2>
      <p>诈骗分子可能冒充客服，以订单异常或退款为由，要求提供银行卡号和验证码。</p>
      <p>正规平台不会索要短信验证码，也不会要求向所谓“安全账户”转账。遇到此类情况应立即停止操作，通过官方渠道核实并报警。</p>
      <h2>安全建议</h2>
      <ul><li>不要泄露银行卡和验证码。</li><li>不要点击陌生客服发送的退款链接。</li><li>保留证据并联系警方。</li></ul>
