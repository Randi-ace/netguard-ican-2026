<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💋 成人娱乐</title>
    <meta name="data-danger-type" content="porn">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #2d0a1e 0%, #1a0a2e 50%, #0f0f23 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #ff6b9d;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-buttons {
            display: flex;
            gap: 15px;
        }

        .header-btn {
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .header-btn.pink {
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            color: white;
        }

        .header-btn.pink:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
        }

        .header-btn.white {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header-btn.white:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .main-content {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #ff6b9d;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 107, 157, 0.2);
        }

        .video-card:hover {
            border-color: #ff6b9d;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.2);
        }

        .video-thumbnail {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c084fc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: white;
        }

        .video-info {
            padding: 15px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .video-meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            gap: 15px;
        }

        .footer {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="main-content">

        <div class="video-grid">
            <div class="video-card">
                <div class="video-thumbnail">

                </div>
                <div class="video-info">

                    <div class="video-meta">
                        <span>👁️ 125.5万</span>

                    </div>
                </div>
            </div>
            
            <div class="video-card">

                <div class="video-info">

                    <div class="video-meta">
                        <span>👁️ 98.3万</span>

                    </div>
                </div>
            </div>
            
            <div class="video-card">
                <div class="video-thumbnail">
                    <span>💄</span>

                </div>
                <div class="video-info">

            <div class="video-card">

                <div class="video-info">

                    <div class="video-meta">

                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>仅限18岁以上成人访问</p>
        <p style="margin-top: 10px;">本网站内容仅供成人娱乐</p>
    </div>
</body>
</html>
