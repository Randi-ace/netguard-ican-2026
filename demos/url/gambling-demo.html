<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线娱乐城 - 精彩游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
        }
        .nav-links a:hover { color: #ffd700; }
        .balance {
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            padding: 8px 20px;
            border-radius: 20px;
            color: #1a1a2e;
            font-weight: bold;
        }
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .hero-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .hero-title {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-subtitle { color: rgba(255,255,255,0.7); margin-bottom: 30px; }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .game-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
            box-shadow: 0 10px 30px rgba(255,215,0,0.2);
        }
        .game-icon { font-size: 50px; margin-bottom: 15px; }
        .game-name { font-size: 16px; margin-bottom: 10px; }
        .game-payout {
            font-size: 12px;
            color: #ffd700;
            background: rgba(255,215,0,0.1);
            padding: 5px 15px;
            border-radius: 10px;
        }
        .bet-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .bet-title {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .bet-inputs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .bet-input {
            padding: 15px 25px;
            font-size: 18px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            width: 200px;
        }
        .bet-button {
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            padding: 15px 50px;
            border: none;
            border-radius: 10px;
            color: #1a1a2e;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .bet-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255,215,0,0.4);
        }
        .featured-games {
            margin-top: 40px;
        }
        .featured-title {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .slot-machine {
            background: linear-gradient(135deg, #2d1b4e, #1a1a2e);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 3px solid #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }
        .slot-reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .slot-reel {
            background: #000;
            padding: 30px 20px;
            border-radius: 10px;
            font-size: 48px;
            animation: spin 0.1s infinite;
        }
        .slot-button {
            background: linear-gradient(90deg, #dc2626, #ef4444);
            padding: 20px 60px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .slot-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(239,68,68,0.4);
        }
        @keyframes spin {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        .promo-banner {
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 30px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎰 皇家娱乐城</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">真人娱乐</a>
            <a href="#">电子游戏</a>
            <a href="#">体育投注</a>
            <a href="#">优惠活动</a>
        </div>
        <div class="balance">💰 账户余额: ¥10,000</div>
    </div>

    <div class="main-content">
        <div class="hero-section">
            <h1 class="hero-title">🎰 皇家娱乐城</h1>
            <p class="hero-subtitle">24小时在线 · 即时到账 · 安全可靠</p>
        </div>

        <div class="game-grid">
            <div class="game-card">
                <div class="game-icon">🎲</div>
                <div class="game-name">百家乐</div>
                <div class="game-payout">返水1.2%</div>
            </div>
            <div class="game-card">
                <div class="game-icon">🎰</div>
                <div class="game-name">老虎机</div>
                <div class="game-payout">最高98%</div>
            </div>
            <div class="game-card">
                <div class="game-icon">🃏</div>
                <div class="game-name">德州扑克</div>
                <div class="game-payout">返水0.8%</div>
            </div>
            <div class="game-card">
                <div class="game-icon">⚽</div>
                <div class="game-name">体育投注</div>
                <div class="game-payout">首存优惠</div>
            </div>
        </div>

        <div class="bet-section">
            <h2 class="bet-title">🎯 快速下注</h2>
            <div class="bet-inputs">
                <input type="text" class="bet-input" placeholder="选择游戏">
                <input type="text" class="bet-input" placeholder="下注金额">
                <button class="bet-button">立即下注</button>
            </div>
        </div>

        <div class="featured-games">
            <h2 class="featured-title">🔥 热门老虎机</h2>
            <div class="slot-machine">
                <div class="slot-reels">
                    <div class="slot-reel">🍒</div>
                    <div class="slot-reel">⭐</div>
                    <div class="slot-reel">🔔</div>
                </div>
                <button class="slot-button">🎰 开始游戏</button>
            </div>
        </div>

        <div class="promo-banner">
            🎁 新用户注册即送100元现金！首存1000送500！限时优惠，先到先得！
        </div>
    </div>
</body>
</html>
