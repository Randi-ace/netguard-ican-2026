<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL风险检测演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, #e0e7ff 30%, #c7d2fe 60%, #ddd6fe 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            color: #4338ca;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }

        .header p {
            color: #6366f1;
            font-size: 16px;
        }

        .divider {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #8b5cf6, #6366f1);
            border-radius: 2px;
            margin: 20px auto 0;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .module-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 1px solid rgba(139, 92, 246, 0.1);
            overflow: hidden;
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--card-glow-color), var(--card-color));
        }

        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(139, 92, 246, 0.15);
            border-color: var(--card-color);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--card-glow-color), var(--card-color));
        }

        .card-title {
            color: #1f2937;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-desc {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .card-arrow {
            color: var(--card-color);
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .module-card:hover .card-arrow {
            transform: translateX(4px);
        }

        .module-card.gambling {
            --card-color: #f59e0b;
            --card-glow-color: #fbbf24;
        }

        .module-card.porn {
            --card-color: #ec4899;
            --card-glow-color: #f472b6;
        }

        .module-card.phishing {
            --card-color: #ef4444;
            --card-glow-color: #f87171;
        }

        .module-card.safe {
            --card-color: #22c55e;
            --card-glow-color: #4ade80;
        }

        .module-card.gambling .card-tag {
            background: rgba(245, 158, 11, 0.1);
            color: #d97706;
        }

        .module-card.porn .card-tag {
            background: rgba(236, 72, 153, 0.1);
            color: #db2777;
        }

        .module-card.phishing .card-tag {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }

        .module-card.safe .card-tag {
            background: rgba(34, 197, 94, 0.1);
            color: #16a34a;
        }

        .domain-info {
            background: rgba(139, 92, 246, 0.05);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 12px;
            color: #6366f1;
            margin-top: 12px;
            text-align: center;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 41, 59, 0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 64px;
            height: 64px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
        }

        .safe-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #16a34a, #22c55e);
            padding: 16px 24px;
            z-index: 999;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .safe-banner.active {
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .safe-banner-content {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }

        .safe-banner-icon {
            font-size: 24px;
        }

        .safe-banner-text {
            font-size: 14px;
            font-weight: 500;
        }

        .safe-banner-countdown {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
        }

        .safe-banner-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        .safe-banner-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 URL风险检测演示</h1>
            <p>点击下方链接，体验智能URL风险检测功能</p>
            <div class="divider"></div>
        </div>

        <div class="modules-grid">
            <div class="module-card gambling" data-url="gambling-demo.html">
                <div class="card-icon">🎰</div>
                <h3 class="card-title">赌博网站</h3>
                <p class="card-desc">非法网络赌博平台，涉嫌违法犯罪活动</p>
                <div class="domain-info">gambling-demo.html</div>
                <div class="card-footer">
                    <span class="card-tag">高风险</span>
                    <span class="card-arrow">→</span>
                </div>
            </div>

            <div class="module-card porn" data-url="porn-demo.html">
                <div class="card-icon">🔞</div>
                <h3 class="card-title">色情网站</h3>
                <p class="card-desc">不良色情内容平台，危害身心健康</p>
                <div class="domain-info">porn-demo.html</div>
                <div class="card-footer">
                    <span class="card-tag">高风险</span>
                    <span class="card-arrow">→</span>
                </div>
            </div>

            <div class="module-card phishing" data-url="phishing-demo.html">
                <div class="card-icon">🎣</div>
                <h3 class="card-title">钓鱼网站</h3>
                <p class="card-desc">伪装成正规银行的诈骗网站</p>
                <div class="domain-info">phishing-demo.html</div>
                <div class="card-footer">
                    <span class="card-tag">高风险</span>
                    <span class="card-arrow">→</span>
                </div>
            </div>

            <div class="module-card safe" data-url="safe-demo.html">
                <div class="card-icon">✅</div>
                <h3 class="card-title">安全网站</h3>
                <p class="card-desc">正规可信的安全网站，可放心访问</p>
                <div class="domain-info">safe-demo.html</div>
                <div class="card-footer">
                    <span class="card-tag">安全</span>
                    <span class="card-arrow">→</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.module-card');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                const url = card.dataset.url;
                const fullUrl = (url.startsWith('http') || url.endsWith('.html')) ? url : `https://${url}`;
                window.location.href = fullUrl;
            });
        });
    </script>
</body>
</html>
