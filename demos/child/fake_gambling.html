<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 在线娱乐城</title>
    <meta name="data-danger-type" content="gambling">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 顶部导航 */
        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #ffd700;
        }

        /* 主体内容 */
        .main-content {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 老虎机动画 */
        .slot-machine {
            background: linear-gradient(135deg, #2d1b4e 0%, #1a0a2e 100%);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }

        .slot-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .slot-reels {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .reel {
            width: 80px;
            height: 100px;
            background: #1a0a2e;
            border-radius: 12px;
            border: 2px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: spin 3s ease-in-out infinite;
        }

        .reel:nth-child(2) { animation-delay: 0.1s; }
        .reel:nth-child(3) { animation-delay: 0.2s; }

        @keyframes spin {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-20px); }
            50% { transform: translateY(-40px); }
            75% { transform: translateY(-20px); }
        }

        .bet-btn {
            padding: 18px 45px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .bet-btn.red {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
        }

        .bet-btn.red:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.5);
        }

        .bet-btn.yellow {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .bet-btn.yellow:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.5);
        }

        /* 游戏列表 */
        .games-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
        }

        .game-card:hover {
            border-color: #ffd700;
            transform: translateY(-5px);
        }

        .game-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
        }

        .game-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .game-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            border-radius: 10px;
            color: #ffd700;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-btn:hover {
            background: #ffd700;
            color: #1a0a2e;
        }

        /* 底部提示 */
        .footer {
            text-align: center;
            padding: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span>🎰</span>
            <span>幸运娱乐城</span>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-link">首页</a>
            <a href="#" class="nav-link">真人娱乐</a>
            <a href="#" class="nav-link">体育赛事</a>
            <a href="#" class="nav-link">电子游戏</a>
            <a href="#" class="nav-link">优惠活动</a>
        </div>
    </div>

    <div class="main-content">
        <div class="slot-machine">
            <h2 class="slot-title">🎰 幸运老虎机</h2>
            <div class="slot-reels">
                <div class="reel">🍒</div>
                <div class="reel">⭐</div>
                <div class="reel">💰</div>
            </div>
            <div>
                <button class="bet-btn red">🎯 立即下注 ¥100</button>
                <button class="bet-btn yellow">🎁 免费试玩</button>
            </div>
        </div>

        <div class="games-section">
            <div class="game-card">
                <div class="game-icon">🃏</div>
                <div class="game-title">德州扑克</div>
                <div class="game-desc">经典扑克游戏，真人对战，赢取大奖</div>
                <button class="game-btn">开始游戏</button>
            </div>
            <div class="game-card">
                <div class="game-icon">🎲</div>
                <div class="game-title">轮盘赌</div>
                <div class="game-desc">幸运转盘，押注赢取丰厚奖励</div>
                <button class="game-btn">开始游戏</button>
            </div>
            <div class="game-card">
                <div class="game-icon">🎮</div>
                <div class="game-title">电子游戏</div>
                <div class="game-desc">多款热门电子游戏，超高倍率</div>
                <button class="game-btn">开始游戏</button>
            </div>
            <div class="game-card">
                <div class="game-icon">⚽</div>
                <div class="game-title">体育投注</div>
                <div class="game-desc">全球体育赛事，实时投注</div>
                <button class="game-btn">开始投注</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>18岁以上成人娱乐 | 娱乐仅供消遣</p>
    </div>
</body>
</html>
