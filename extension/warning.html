<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚠️ 风险警告</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .warning-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(239, 68, 68, 0.25);
      padding: 48px;
      max-width: 480px;
      text-align: center;
      border: 2px solid #fecaca;
    }
    .warning-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3);
    }
    h1 {
      color: #991b1b;
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      color: #7f1d1d;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .info-card {
      background: #fef2f2;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: left;
    }
    .info-row {
      display: flex;
      margin-bottom: 12px;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .info-label {
      font-weight: 600;
      color: #991b1b;
      min-width: 80px;
      font-size: 14px;
    }
    .info-value {
      font-size: 14px;
      color: #b91c1c;
      word-break: break-all;
    }
    .risk-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 32px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.39);
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(239, 68, 68, 0.45);
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      margin-left: 12px;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    .footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #fecaca;
      font-size: 12px;
      color: #9ca3af;
    }
    .footer a {
      color: #ef4444;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="warning-container">
    <div class="warning-icon">⚠️</div>
    <h1>检测到高风险网站</h1>
    <p>净网护航安全系统检测到您访问的网站存在安全风险，为保护您的隐私和财产安全，已自动拦截该页面。</p>
    
    <div class="info-card">
      <div class="info-row">
        <span class="info-label">风险等级:</span>
        <span class="info-value"><span id="risk-level" class="risk-badge">HIGH</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">风险原因:</span>
        <span class="info-value" id="risk-reason">正在加载...</span>
      </div>
      <div class="info-row">
        <span class="info-label">被拦截网址:</span>
        <span class="info-value" id="blocked-url">正在加载...</span>
      </div>
    </div>
    
    <div>
      <button class="btn btn-danger" id="go-back">返回上一页</button>
      <button class="btn btn-secondary" id="proceed">继续访问（不推荐）</button>
    </div>
    <div class="footer">
      由 <a href="#" target="_blank">净网护航</a> 安全系统保护
    </div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
